<section class="newsletter-hero section">

  <div class="wrap">

    <p class="eyebrow ">
      Email Marketing
    </p>

    <h1
      class="display-xl  d1"
      style="max-width:800px;margin-bottom:20px">

      NEWSLETTER
      <span class="g-text">
        MANAGEMENT
      </span>

    </h1>

    <p
      class="body-lg  d2"
      style="max-width:650px;margin-bottom:56px">

      Create technology updates, announcements,
      promotions and scheduled newsletters for all
      registered ANVEXS users.

    </p>

  </div>

</section>

<section
  class="section"
  style="background:var(--bg-2);border-top:1px solid var(--border)">

  <div class="wrap">

    <div class="section-header-center">

      <p class="eyebrow">
        Campaign Builder
      </p>

      <h2 class="display-lg ">
        CREATE NEWSLETTER
      </h2>

    </div>

    <div
      class="campaign-wrap  d1"
      style="max-width:900px;margin:0 auto">

      <div class="form-group">

        <label class="form-label">
          Newsletter Subject *
        </label>

        <input
          class="form-input"
          [(ngModel)]="campaign.subject"
          placeholder="Angular 21 Released..." />

      </div>

      <div class="form-group">

        <label class="form-label">
          Schedule Delivery *
        </label>

        <input
          type="datetime-local"
          class="form-input"
          [(ngModel)]="campaign.scheduledFor" />

      </div>

      <div class="form-group">

        <label class="form-label">
          Newsletter Content *
        </label>

        <textarea
          class="form-textarea newsletter-textarea"
          [(ngModel)]="campaign.content"
          placeholder="Write your newsletter content here...">
        </textarea>

      </div>

      <div class="form-group">

        <label class="form-label">
          Attachment (Optional)
        </label>

        <input
          type="file"
          class="form-input"
          (change)="onFileSelected($event)" />

      </div>

      @if (selectedFile) {

        <div class="attachment-preview">
          📎 {{ selectedFile.name }}
        </div>

      }

      <button
        class="btn btn-primary btn-lg"
        style="width:100%;justify-content:center"
        (click)="sendNewsletter()"
        [disabled]="loading()">

        {{
          loading()
          ? 'Scheduling Newsletter...'
          : 'Schedule Newsletter →'
        }}

      </button>

    </div>

  </div>

</section>

<div class="auth-page">
      <div class="auth-inner">
        <div class="auth-logo reveal">
          <div class="logo-mark">A</div>
          <div class="logo-text">ANVEXS</div>
        </div>

        <!-- Login Tab -->
        @if (tab() === 'login') {
          <div class="auth-form reveal">
            <h2 style="margin-bottom:24px;font-size:1.8rem">Welcome Back</h2>

            <div class="form-group">
              <label class="form-label">Email</label>
              <input class="form-input" type="email" [(ngModel)]="loginForm.email"
                     placeholder="you@company.com" [disabled]="authLoading()" />
            </div>

            <div class="form-group">
              <label class="form-label">Password</label>
              <input class="form-input" type="password" [(ngModel)]="loginForm.password"
                     placeholder="••••••••" [disabled]="authLoading()" />
            </div>

            <button class="btn btn-primary btn-lg" (click)="login()" style="width:100%;justify-content:center"
                    [disabled]="authLoading()">
              {{ authLoading() ? 'Logging in...' : 'Log In' }}
            </button>

            <p class="auth-switch">
              Don't have an account?
              <a (click)="setTab('register')" style="color:var(--primary);cursor:pointer;font-weight:600">
                Register here
              </a>
            </p>
          </div>
        }

        <!-- Register Tab -->
        @if (tab() === 'register') {
          <div class="auth-form reveal">
            <h2 style="margin-bottom:24px;font-size:1.8rem">Create Account</h2>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">First Name</label>
                <input class="form-input" [(ngModel)]="registerForm.firstName"
                       placeholder="John" [disabled]="authLoading()" />
              </div>
              <div class="form-group">
                <label class="form-label">Last Name</label>
                <input class="form-input" [(ngModel)]="registerForm.lastName"
                       placeholder="Doe" [disabled]="authLoading()" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Email</label>
              <input class="form-input" type="email" [(ngModel)]="registerForm.email"
                     placeholder="you@company.com" [disabled]="authLoading()" />
            </div>

            <div class="form-group">
              <label class="form-label">Password (min 8 chars)</label>
              <input class="form-input" type="password" [(ngModel)]="registerForm.password"
                     placeholder="••••••••" [disabled]="authLoading()" />
            </div>

            <div class="form-group">
              <label class="form-label">Phone (optional)</label>
              <input class="form-input" [(ngModel)]="registerForm.phone"
                     placeholder="+91 98765 43210" [disabled]="authLoading()" />
            </div>

            <button class="btn btn-primary btn-lg" (click)="register()" style="width:100%;justify-content:center"
                    [disabled]="authLoading()">
              {{ authLoading() ? 'Creating Account...' : 'Create Account' }}
            </button>

            <p class="auth-switch">
              Already have an account?
              <a (click)="setTab('login')" style="color:var(--primary);cursor:pointer;font-weight:600">
                Log in here
              </a>
            </p>
          </div>
        }

        @if (error()) {
          <div class="auth-error reveal">⚠️ {{ error() }}</div>
        }
      </div>

      <!-- Background design -->
      <div class="auth-bg"></div>
    </div>

@if ((online$ | async)) {
@if (showLoader()) {
<app-loader (loadComplete)="onLoadComplete()" />
} @else {
<div class="site-wrapper" [class.site-ready]="true">
  <app-navbar />
  <main id="main-content" class="main-content" role="main">
    <router-outlet />
  </main>
  <app-footer />
</div>
<app-chatbot />
}
<app-api-loader />
<app-toast />
}@else{
<app-offline />
}

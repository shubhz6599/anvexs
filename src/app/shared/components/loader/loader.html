@if (!isComplete()) {
  <div class="loader">
    <div class="loader-inner">
      <div class="loader-logo reveal">
        <div class="loader-a">ANVEXS</div>
      </div>

      <div class="loader-tagline reveal d1">
        ENTERPRISE IT HUB · INITIALIZING SYSTEMS
      </div>

      <div class="loader-bar-wrap reveal d2">
        <div class="loader-bar" [style.width.%]="progress()"></div>
      </div>

      <div class="loader-pct reveal d3">
        {{ Math.floor(progress()) }}%
      </div>
    </div>
  </div>
}

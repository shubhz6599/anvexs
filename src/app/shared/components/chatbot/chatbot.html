@if (!isOpen()) {
  <button class="chatbot__fab"
          (click)="toggleChat()"
          aria-label="Open chat">

    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
    </svg>

    <span class="chatbot__fab-pulse"></span>
  </button>
}

<!-- Chat Window -->
@if (isOpen()) {
  <div class="chatbot__window" role="dialog" aria-label="Anvexs Chat Assistant">

    <!-- Header -->
    <div class="chatbot__header">
      <div class="chatbot__header-avatar">
        <img src="images/anvexs-logo.png" alt="Anvexs" />
      </div>
      <div class="chatbot__header-info">
        <p class="chatbot__header-name">Anvexs Assistant</p>
        <p class="chatbot__header-status">
          <span class="chatbot__status-dot"></span> Online
        </p>
      </div>
      <button class="chatbot__header-close" (click)="toggleChat()" aria-label="Close chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <div class="chatbot__messages" aria-live="polite">
      @for (msg of messages(); track msg.timestamp) {
        <div class="chatbot__msg" [class.chatbot__msg--user]="msg.role === 'user'">
          @if (msg.role === 'assistant') {
            <div class="chatbot__msg-avatar">A</div>
          }
          <div class="chatbot__msg-bubble">
            <p class="chatbot__msg-text">{{ msg.content }}</p>
            <span class="chatbot__msg-time">{{ formatTime(msg.timestamp) }}</span>
          </div>
        </div>
      }

      @if (isLoading()) {
        <div class="chatbot__msg">
          <div class="chatbot__msg-avatar">A</div>
          <div class="chatbot__msg-bubble chatbot__msg-bubble--typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      }

      <div #messagesEnd></div>
    </div>

    <!-- Quick Replies -->
    <!-- <div class="chatbot__quick-replies">
      <button class="chatbot__quick-btn" (click)="setInput('What services do you offer?')">Services</button>
      <button class="chatbot__quick-btn" (click)="setInput('What are your pricing plans?')">Pricing</button>
      <button class="chatbot__quick-btn" (click)="setInput('How do I contact the team?')">Contact</button>
    </div> -->

    <!-- Input -->
    <div class="chatbot__input-area">
      <textarea class="chatbot__input"
                [value]="userInput()"
                (input)="setInput($any($event.target).value)"
                (keydown)="onKeyDown($event)"
                placeholder="Type a message…"
                rows="1"

                aria-label="Chat message"></textarea>
      <button class="chatbot__send" (click)="sendMessage()"
              [disabled]="!userInput().trim()" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </div>
}

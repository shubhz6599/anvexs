<header class="nav" [class.nav--stuck]="scrolled()" [class.nav--open]="menuOpen()">
      <div class="nav__inner wrap">

        <a routerLink="/" class="nav__logo" (click)="closeMenu()">
          <div class="nav__logo-mark">
            <img src="images/anvexs-logo.png" alt="Anvexs logo" />
          </div>
          <div class="nav__logo-text">
            <span class="nav__logo-name">ANVEXS</span>
            <span class="nav__logo-sub">IT HUB</span>
          </div>
        </a>

        <nav class="nav__links" aria-label="Main navigation">
          @for (item of navItems; track item.path) {
            <a [routerLink]="item.path"
               routerLinkActive="nav__link--active"
               [routerLinkActiveOptions]="{ exact: item.path === '/' }"
               class="nav__link"
               (click)="closeMenu()">
              {{ item.label }}
            </a>
          }
        </nav>

        <div class="nav__actions">
          @if (auth.isAuthenticated()) {
            <div class="nav__user">
              <div class="nav__avatar">{{ auth.user()?.firstName?.charAt(0) }}</div>
              <span class="nav__user-name">{{ auth.user()?.firstName }}</span>
              <button class="btn btn-ghost btn-sm" (click)="auth.logout()">Logout</button>
            </div>
          } @else {
            <a routerLink="/auth" class="btn btn-ghost btn-sm" (click)="closeMenu()">Log In</a>
            <a routerLink="/contact" class="btn btn-primary btn-sm" (click)="closeMenu()">Get Started</a>
          }
        </div>

        <button class="nav__burger" [class.nav__burger--open]="menuOpen()"
                (click)="toggleMenu()" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>

      <!-- Mobile drawer -->
      <div class="nav__drawer" [class.nav__drawer--open]="menuOpen()">
        @for (item of navItems; track item.path) {
          <a [routerLink]="item.path"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: item.path === '/' }"
             class="nav__drawer-link"
             (click)="closeMenu()">
            {{ item.label }}
          </a>
        }
        <div class="nav__drawer-actions">
          <a routerLink="/auth" class="btn btn-ghost" (click)="closeMenu()">Log In</a>
          <a routerLink="/contact" class="btn btn-primary" (click)="closeMenu()">Get Started</a>
        </div>
      </div>
    </header>
